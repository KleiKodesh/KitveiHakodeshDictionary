name: Dicta abbreviation expansions

# Asks Dicta's abbreviation expander about every abbreviation headword (resumable), then
# optionally turns the answers into source/ changes on a review branch with a pull request.
#
# Progress: the answers live in dicta_abbreviations.jsonl on the branch `dicta-cache`, committed
# and pushed after EVERY batch. A failed, cancelled or timed-out run loses at most one batch;
# rerun the workflow and it skips everything already cached.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Query Dicta for headwords not yet cached"
        type: boolean
        default: true
      batch_size:
        description: "Headwords per request"
        default: "50"
      max_batches:
        description: "Stop after this many batches (0 = until done or the time limit)"
        default: "0"
      apply:
        description: "Then write the cache into source/ and open a pull request"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dicta-abbreviations
  cancel-in-progress: false

jobs:
  query:
    if: ${{ inputs.query }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out the cache branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dicta-cache; then
            git worktree add -B dicta-cache cache origin/dicta-cache
          else
            git worktree add --orphan -b dicta-cache cache
          fi
          wc -l cache/dicta_abbreviations.jsonl || true

      # Clean stop at 330 minutes, well before the 350-minute job limit (6 h hard cap).
      - name: Query Dicta (resumable)
        id: q
        run: >
          python import/dicta_abbreviations/query_dicta.py
          --cache cache/dicta_abbreviations.jsonl
          --batch-size "${{ inputs.batch_size }}"
          --max-batches "${{ inputs.max_batches }}"
          --deadline-minutes 330
          --git-push cache

  apply:
    needs: query
    if: ${{ always() && inputs.apply && needs.query.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply the cache to source/
        run: |
          git fetch origin dicta-cache
          git show origin/dicta-cache:dicta_abbreviations.jsonl > "$RUNNER_TEMP/dicta.jsonl"
          sha=$(git rev-parse --short origin/dicta-cache)
          python import/dicta_abbreviations/apply_dicta.py --cache "$RUNNER_TEMP/dicta.jsonl" \
            --pin "dicta-cache branch commit $sha ($(date -u +%Y-%m-%d))"
          echo "CACHE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Build + round-trip check
        run: |
          python build.py --out build/Dictionary.db
          cp -r source "$RUNNER_TEMP/source.applied"
          python export.py build/Dictionary.db
          diff -r source "$RUNNER_TEMP/source.applied"
          python build.py --out build/roundtrip.db
          python verify.py build/Dictionary.db build/roundtrip.db

      - name: Push review branch and open a pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dicta-abbreviations
          git add source sources.json
          git commit -F - <<EOF
          Dictionary: Dicta abbreviation expansions and sense ranks

          From dicta-cache commit $CACHE_SHA (import/dicta_abbreviations/apply_dicta.py).

          User-facing: improved - Dictionary: abbreviations show their most likely meaning first, with missing meanings added
          User-facing-he: ראשי תיבות במילון מציגים קודם את הפירוש הסביר ביותר, ונוספו פירושים חסרים
          EOF
          git push -f origin dicta-abbreviations
          gh pr view dicta-abbreviations >/dev/null 2>&1 || \
            gh pr create --base main --head dicta-abbreviations \
              --title "Dictionary: Dicta abbreviation expansions and sense ranks" \
              --body "Generated by the Dicta abbreviation expansions workflow from dicta-cache commit $CACHE_SHA. Review source/senses/source_12.tsv and source/sense_rank.tsv."
